# ============================================================
# 🐳 Docker Compose do Archimedes - Serviços do Cofre
# ============================================================
# Serviços containerizados para máxima portabilidade.
# Compatível com: Docker Compose v2.20+
#
# Uso:
#   cd ~/archimedes-vault/guia-ia-local/docker
#   docker compose up -d          # Iniciar tudo
#   docker compose down           # Parar tudo
#   docker compose logs -f        # Ver logs
# ============================================================

services:
  # 🦙 Ollama - Runtime de IA Local
  ollama:
    image: ollama/ollama:latest
    container_name: archimedes-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=2h
    # ⚠️ Descomente para GPU NVIDIA:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 📊 Monitoramento (opcional)
  # ctop:
    # image: quay.io/vektorlab/ctop:latest
    # container_name: jervis-ctop
    # restart: unless-stopped
    # ports:
    #   - "8080:8080"
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock

volumes:
  ollama-data:
    name: jervis-ollama-data
